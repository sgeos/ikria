# Ikria's Rust workspace. The crates here are 0BSD. The bridge to kRPC is GPL-3.0 and
# lives in its own repository, sgeos/ikria-bridge, as charter item 6 and the harness
# design require.
[workspace]
resolver = "3"
members = ["crates/ikria-harness", "crates/ikria-records"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "0BSD"
repository = "https://github.com/sgeos/ikria"
publish = false

[workspace.dependencies]
# Keleusma at its released version, which the harness follows deliberately.
keleusma = "0.2.2"
# Serialization of the records and the messages between processes.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
